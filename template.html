<!DOCTYPE html>
<!-- Built by site.py from template.html, content.json and highlights.json. Edit those, not this file. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{hero.tagline}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='Menlo,monospace' font-weight='700' font-size='30' text-anchor='middle' fill='%23ffeb33'%3EV+%3C/text%3E%3C/svg%3E">
<style>
/* The app's Old School palette (Vidiprinter/Views/Teletext.swift), dark. */
:root {
  --bg: #000;
  --text: #fff;
  --yellow: #ffeb33;
  --cyan: #4de6ff;
  --green: #59f266;
  --red: #ff4d4d;
  --magenta: #ff66ff;
  --quiet: #9e9e9e;
  --sep: #2e2e2e;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Roboto Mono", monospace;
  --code-w: 3.6em;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: clamp(14px, 1.2vw + 10px, 17px);
  line-height: 1.45;
  overflow-x: hidden;
}
/* Faint scanlines, like the old set. */
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  z-index: 50;
}
a { color: var(--cyan); }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }

/* Header line: the name and the button */
.bar {
  position: sticky; top: 0; z-index: 40;
  background: var(--bg);
  border-bottom: 1px solid var(--sep);
}
.bar .wrap {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 48px;
  font-size: .82em;
}
.bar .name { color: var(--yellow); font-weight: 700; }
.bar .get {
  background: var(--cyan); color: #000; text-decoration: none;
  font-weight: 700; padding: 6px 10px; white-space: nowrap;
}
.bar .get:hover, .bar .get:focus-visible { background: var(--yellow); }

/* Title */
.hero { padding: clamp(28px, 6vw, 64px) 0 18px; }
h1 {
  margin: 0;
  font-size: clamp(40px, 9vw, 84px);
  line-height: 1;
  letter-spacing: -.02em;
  color: var(--yellow);
  font-weight: 800;
}
h1 .plus { color: var(--cyan); }
.tag {
  margin: 14px 0 0;
  font-size: clamp(16px, 1.6vw + 11px, 22px);
  max-width: 34em;
}

/* Subpage strip, like the app's view chips */
.strip {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin: 26px 0 12px;
}
.chip {
  font: inherit; font-size: .82em; font-weight: 700;
  color: var(--quiet); background: transparent;
  border: 1px solid var(--sep);
  padding: 7px 12px; cursor: pointer;
  text-transform: uppercase;
}
.chip .n { color: var(--green); margin-right: .5em; }
.chip[aria-selected="true"] { color: #000; background: var(--text); border-color: var(--text); }
.chip[aria-selected="true"] .n { color: #000; }
.chip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.chip.nudge { animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { border-color: var(--yellow); color: var(--yellow); } }

/* The screen */
.screen { border-top: 1px solid var(--sep); }
.page { padding-top: 10px; }
.feed {
  position: relative;
  height: clamp(380px, 58svh, 560px);
  overflow: hidden;
}
.feed::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
  background: linear-gradient(transparent, var(--bg));
  pointer-events: none;
}
.note { color: var(--quiet); font-size: .78em; margin: 10px 0 0; }

/* A vidiprinter row (FeedRow) */
.row {
  display: grid;
  grid-template-columns: var(--code-w) 1fr;
  column-gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--sep);
}
.row.fresh { background: rgba(77,230,255,.10); }
.code { color: var(--green); font-weight: 700; font-size: .8em; padding-top: .15em; white-space: nowrap; }
.head { display: flex; flex-wrap: wrap; column-gap: .7em; align-items: baseline; }
.lab { font-weight: 700; }
.c-yellow { color: var(--yellow); }
.c-cyan { color: var(--cyan); }
.c-green { color: var(--green); }
.c-red { color: var(--red); }
.c-magenta { color: var(--magenta); }
.c-grey { color: var(--quiet); }
.player { font-size: .98em; margin-top: 2px; }
.assist { color: var(--quiet); font-size: .88em; }
.ins { display: flex; gap: .5em; color: var(--quiet); font-size: .88em; margin: 3px 0 0 1.1em; }
.ins .chev { color: var(--cyan); }
.wait { display: none !important; }
.cursor {
  display: inline-block; width: .6em; height: 1.05em;
  background: var(--text); vertical-align: -.15em; margin-left: 1px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.row.out { opacity: 0; transform: translateX(-6px); transition: opacity .12s, transform .12s; }

/* Features page */
.features .row { padding: 14px 0; }
.features .head { font-size: 1.12em; }
.features .score { font-weight: 700; }
.features .ins { font-size: .92em; color: #c9c9c9; }
.strike { text-decoration: line-through; color: var(--quiet); }

.cta { padding: 28px 0 10px; transition: opacity .4s; }
.cta.wait { display: block !important; opacity: 0; visibility: hidden; }
.store {
  display: inline-flex; align-items: center; gap: 12px;
  background: var(--yellow); color: #000; text-decoration: none;
  font-weight: 800; font-size: 1.05em;
  padding: 14px 20px;
}
.store:hover, .store:focus-visible { background: var(--cyan); }
.store.soon, .store.soon:hover { background: transparent; color: var(--yellow); border: 2px solid var(--yellow); cursor: default; }
.store svg { width: 22px; height: 22px; flex: none; }
.price { color: var(--quiet); font-size: .85em; margin: 12px 0 0; }

footer { border-top: 1px solid var(--sep); margin-top: 48px; padding: 18px 0 40px; color: var(--quiet); font-size: .78em; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; }

/* Without script, or with reduced motion: both pages, one after the other. */
html:not(.js) .strip, html.still .strip { display: none; }
html:not(.js) .page[hidden], html.still .page[hidden] { display: block; }
html.still .feed, html:not(.js) .feed { height: auto; }
html.still .feed::after, html:not(.js) .feed::after { display: none; }
html:not(.js) .features, html.still .features { margin-top: 32px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <span class="name">{{header.name}}</span>
    {{{get_link}}}
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>{{hero.title}}<span class="plus">{{hero.titleEnd}}</span></h1>
    <p class="tag">{{{hero.tagline}}}</p>
  </section>

  <div class="strip" role="tablist" aria-label="Pages">
    <button class="chip" role="tab" id="tab-feed" aria-controls="page-feed" aria-selected="true"><span class="n">1/2</span>{{tabs.feed}}</button>
    <button class="chip" role="tab" id="tab-features" aria-controls="page-features" aria-selected="false"><span class="n">2/2</span>{{tabs.features}}</button>
  </div>

  <div class="screen">
    <section class="page" id="page-feed" role="tabpanel" aria-labelledby="tab-feed">
      <h2 class="sr">{{tabs.feed}}</h2>
      <div class="feed" id="feed" aria-live="off">
{{{feed_rows}}}
      </div>
      <p class="note">{{feed_note}}</p>
    </section>

    <section class="page features" id="page-features" role="tabpanel" aria-labelledby="tab-features" hidden>
      <h2 class="sr">{{tabs.features}}</h2>
      <div id="feat">
{{{feature_rows}}}
      </div>

      <div class="cta" id="get">
        {{{store_button}}}
        <p class="price">{{{download.note}}}</p>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>{{footer.text}}</span>
    <a href="{{footer.privacyUrl}}">{{footer.privacyLink}}</a>
  </div>
</footer>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const SPEED = {{{typing_speeds}}};
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) document.documentElement.classList.add("still");

  /* Typing: a row's text comes out character by character, its lines
     appearing as they're reached, with the block cursor on the end. */
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  cursor.setAttribute("aria-hidden", "true");
  let run = 0; // bumped to cancel whatever is typing
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function prepare(row) {
    const parts = [];
    const walk = document.createTreeWalker(row, NodeFilter.SHOW_TEXT);
    for (let n; (n = walk.nextNode());) {
      if (!n.data.trim()) continue;
      const block = n.parentElement.closest(".head, .player, .assist, .ins, .code");
      parts.push({ n, text: n.data, block });
      n.data = "";
    }
    new Set(parts.map((p) => p.block).filter(Boolean)).forEach((b) => b.classList.add("wait"));
    return parts;
  }
  async function type(row, cps, id) {
    const parts = prepare(row);
    row.classList.remove("wait");
    const total = parts.reduce((s, p) => s + p.text.length, 0);
    const t0 = performance.now();
    let shown = 0;
    while (shown < total) {
      if (id !== run) return false;
      await new Promise(requestAnimationFrame);
      shown = Math.min(total, Math.floor((performance.now() - t0) / 1000 * cps) + 1);
      let left = shown, last = null;
      for (const p of parts) {
        const k = Math.min(p.text.length, left);
        left -= k;
        if (k > 0) { last = p; if (p.block) p.block.classList.remove("wait"); }
        if (p.n.data.length !== k) p.n.data = p.text.slice(0, k);
      }
      if (last && cursor.previousSibling !== last.n) last.n.after(cursor);
    }
    return true;
  }
  const rowsOf = (box) => [...box.children].map((r) => r.outerHTML);
  function make(html) {
    const t = document.createElement("template");
    t.innerHTML = html;
    return t.content.firstElementChild;
  }

  /* Page 1: the feed. The rows are in the page newest first; they print
     oldest first, each at the top, as in the app. */
  const feed = $("#feed");
  const feedRows = rowsOf(feed).reverse();
  async function playFeed() {
    const id = ++run;
    if (still) return;
    feed.replaceChildren();
    for (const html of feedRows) {
      const row = make(html);
      row.classList.add("fresh", "wait");
      feed.prepend(row);
      row.nextElementSibling?.classList.remove("fresh");
      if (!(await type(row, SPEED.feed, id))) return;
      await sleep(420);
      if (id !== run) return;
    }
    feed.firstElementChild?.classList.remove("fresh");
    cursor.remove();
    $("#tab-features").classList.add("nudge");
    await sleep(2600);
    if (id !== run) return;
    await wipe(id);
    if (id === run) show("features");
  }
  /* The page clears from the bottom up before the next one prints. */
  async function wipe(id) {
    cursor.remove();
    for (const r of [...feed.children].reverse()) {
      if (id !== run) return;
      r.classList.add("out");
      await sleep(70);
    }
    await sleep(160);
  }

  /* Page 2: what you get */
  const feat = $("#feat");
  const featHTML = feat.innerHTML;
  async function playFeatures() {
    const id = ++run;
    if (still) return;
    feat.innerHTML = featHTML;
    const cta = $("#get");
    cta.classList.add("wait");
    const rows = [...feat.children];
    rows.forEach((r) => r.classList.add("wait"));
    for (const r of rows) {
      if (!(await type(r, SPEED.features, id))) return;
      await sleep(140);
    }
    cursor.remove();
    if (id === run) cta.classList.remove("wait");
  }

  /* Subpages */
  const tabs = { feed: $("#tab-feed"), features: $("#tab-features") };
  const pages = { feed: $("#page-feed"), features: $("#page-features") };
  let current = null;
  function show(name, { replay = true } = {}) {
    current = name;
    for (const k in tabs) {
      tabs[k].setAttribute("aria-selected", String(k === name));
      tabs[k].tabIndex = k === name ? 0 : -1;
      pages[k].hidden = k !== name;
    }
    tabs.features.classList.remove("nudge");
    const want = name === "features" ? "#features" : "";
    if (location.hash !== want && (want || location.hash === "#features")) {
      try { history.replaceState(null, "", want || location.pathname + location.search); } catch (_) {}
    }
    if (replay) (name === "feed" ? playFeed : playFeatures)();
  }
  tabs.feed.addEventListener("click", () => show("feed"));
  tabs.features.addEventListener("click", () => show("features"));
  $(".strip").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const next = current === "feed" ? "features" : "feed";
    show(next); tabs[next].focus();
  });
  /* Before the app is live, the header button leads to the button at the end. */
  document.querySelectorAll('a[href="#get"]').forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    if (current !== "features" && !still) {
      show("features", { replay: false });
      run++; cursor.remove();
      feat.innerHTML = featHTML; $("#get").classList.remove("wait");
    }
    $("#get").scrollIntoView({ behavior: still ? "auto" : "smooth", block: "center" });
  }));

  if (!still) show(location.hash === "#features" ? "features" : "feed");
})();
</script>
</body>
</html>
